<div class="wrap">
 <div class="top"><a class="home" id="home" href="../../index.html">← <span data-t="toc"></span></a><label class="langsel"><span data-t="lang"></span><select id="lang"></select></label></div>

<script>
{
const { rb, esc, fill, detect, loadAll, langSelect, apply, fillText, plain } = window.AI;
const R = window.RACE, H = R.horses;
let lang = detect();
const main = document.getElementById("main");
const KEY = "ds-" + location.pathname.split("/").filter(Boolean).slice(-1)[0] + "-bets";
let bets = [];
try { bets = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { bets = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(bets)); } catch (e) {} };
const BUDGET = 10000;
const yen = n => "¥" + Math.round(n).toLocaleString("en-US");

/* ---- probability model (Harville) from win odds: only an estimate ---- */
const raw = H.map(h => 0.8 / h[8]), tot = raw.reduce((a, b) => a + b, 0);
const p = raw.map(x => x / tot); // index = horse no - 1
const P3 = []; // ordered top-3 probabilities
const NH = H.length;
for (let i = 0; i < NH; i++) for (let j = 0; j < NH; j++) if (j !== i) for (let k = 0; k < NH; k++) if (k !== i && k !== j)
  P3.push([i, j, k, p[i] * p[j] / (1 - p[i]) * p[k] / (1 - p[i] - p[j])]);
const frameOf = n => H[n - 1][0];
const TYPES = {
  win: { n: 1, ord: true }, place: { n: 1, ord: true }, wakuren: { n: 2, ord: false, frame: true }, umaren: { n: 2, ord: false },
  wide: { n: 2, ord: false }, umatan: { n: 2, ord: true }, trio: { n: 3, ord: false }, trifecta: { n: 3, ord: true }
};
// does ticket hit given finishing order a,b,c (horse numbers)
function hits(t, sel, a, b, c) {
  const s = sel, set = new Set(s);
  switch (t) {
    case "win": return s[0] === a;
    case "place": return [a, b, c].includes(s[0]);
    case "wakuren": { const f = [frameOf(a), frameOf(b)].sort(), g = [...s].sort(); return f[0] === g[0] && f[1] === g[1]; }
    case "umaren": return set.has(a) && set.has(b);
    case "wide": return [a, b, c].filter(x => set.has(x)).length === 2;
    case "umatan": return s[0] === a && s[1] === b;
    case "trio": return set.has(a) && set.has(b) && set.has(c);
    case "trifecta": return s[0] === a && s[1] === b && s[2] === c;
  }
}
function prob(t, sel) { return P3.reduce((acc, [i, j, k, q]) => acc + (hits(t, sel, i + 1, j + 1, k + 1) ? q : 0), 0); }
const plTxt = n => (R.place && R.place[n]) ? R.place[n].map(x => x.toFixed(1)).join("–") : "—";
// display odds: place = real range, win = real, others = estimate
const oddsDisp = (t, sel) => t === "place" ? plTxt(sel[0]) : (estOdds(t, sel) ? estOdds(t, sel).toFixed(1) : "—");
const payRange = (t, sel, a) => t === "place" ? R.place[sel[0]].map(o => a / 100 * Math.round(o * 100)) : [a / 100 * Math.round((estOdds(t, sel) || 0) * 100), a / 100 * Math.round((estOdds(t, sel) || 0) * 100)];
const yr = r => r[0] === r[1] ? yen(r[0]) : yen(r[0]) + "〜" + yen(r[1]);
function estOdds(t, sel) {
  if (t === "win") return H[sel[0] - 1][8];
  if (t === "place") return R.place[sel[0]][0];
  const q = prob(t, sel);
  if (q <= 0) return null;
  return Math.max(1.0, Math.floor(R.rates[t] / q * 10) / 10);
}

/* ---- uniform model, market map, own ratings ---- */
const ALL3 = NH * (NH - 1) * (NH - 2);
const p0 = (t, sel) => { let c = 0; for (let a = 1; a <= NH; a++) for (let b = 1; b <= NH; b++) if (b !== a) for (let d = 1; d <= NH; d++) if (d !== a && d !== b && hits(t, sel, a, b, d)) c++; return c / ALL3; };
const RKEY = KEY + "-rt";
let rt = null;
try { rt = JSON.parse(localStorage.getItem(RKEY) || "null"); } catch (e) { rt = null; }
if (!Array.isArray(rt) || rt.length !== NH) rt = H.map(() => 3);
const saveRt = () => { try { localStorage.setItem(RKEY, JSON.stringify(rt)); } catch (e) {} };
let PS = [], P3S = [];
function buildMine() {
  const sw = rt.reduce((a, b) => a + b, 0);
  PS = rt.map(w => sw > 0 ? 0.999 * w / sw + 0.001 / NH : 1 / NH);
  P3S = [];
  for (let i = 0; i < NH; i++) for (let j = 0; j < NH; j++) if (j !== i) for (let k = 0; k < NH; k++) if (k !== i && k !== j)
    P3S.push([i, j, k, PS[i] * PS[j] / (1 - PS[i]) * PS[k] / (1 - PS[i] - PS[j])]);
}
buildMine();
const probS = (t, sel) => P3S.reduce((acc, [i, j, k, q]) => acc + (hits(t, sel, i + 1, j + 1, k + 1) ? q : 0), 0);
// odds used for expected value: win real, place = middle of range, others = estimate
const evOdds = (t, sel) => t === "place" ? (R.place[sel[0]][0] + R.place[sel[0]][1]) / 2 : estOdds(t, sel);
const evOf = (t, sel) => { const o = evOdds(t, sel); return o ? probS(t, sel) * o : null; };
const fp = x => x >= 0.1 ? (x * 100).toFixed(1) + "%" : x >= 0.01 ? (x * 100).toFixed(1) + "%" : x >= 0.001 ? (x * 100).toFixed(2) + "%" : (x * 100).toFixed(3) + "%";
const vchip = e => e === null ? "" : `<span class="vc ${e >= 1 ? "good" : e >= 0.75 ? "fair" : "bad"}">${rb(e >= 1 ? L.vGood : e >= 0.75 ? L.vFair : L.vBad)}</span>`;
// market probability of every ticket of a type (one pass over P3)
function mktMap(t) {
  const m = new Map(), add = (k, q) => m.set(k, (m.get(k) || 0) + q);
  P3.forEach(([i, j, k, q]) => {
    const a = i + 1, b = j + 1, c = k + 1, so = (...x) => x.sort((x1, y1) => x1 - y1).join("-");
    switch (t) {
      case "win": add("" + a, q); break;
      case "place": add("" + a, q); add("" + b, q); add("" + c, q); break;
      case "wakuren": add(so(frameOf(a), frameOf(b)), q); break;
      case "umaren": add(so(a, b), q); break;
      case "wide": add(so(a, b), q); add(so(a, c), q); add(so(b, c), q); break;
      case "umatan": add(a + "-" + b, q); break;
      case "trio": add(so(a, b, c), q); break;
      case "trifecta": add(a + "-" + b + "-" + c, q); break;
    }
  });
  return m;
}

let L, u, result = null;
const JPT = { win: "単勝", place: "複勝", wakuren: "枠連", umaren: "馬連", wide: "ワイド", umatan: "馬単", trio: "3連複", trifecta: "3連単" };
const JPM = { n: "通常", f: "フォーメーション", b: "ボックス" };
const isJa = () => lang === "ja" || lang === "easy";
const loc = v => String(v).replace(/\s*[(（][^()（）]*[)）]\s*$/, "");
// bet type name: Japanese UI → as is; others → local name + Japanese name
const tName = t => isJa() ? rb(L.types[t]) : `${rb(loc(L.types[t]))} <span class="jp">${JPT[t]}</span>`;
const tTab = t => isJa() ? rb(L.types[t]) : `${rb(loc(L.types[t]))}<small class="jp">${JPT[t]}</small>`;
const mName = m => { const k = { n: "modeN", f: "modeF", b: "modeB" }[m]; return isJa() ? rb(L[k]) : `${rb(loc(L[k]))} <span class="jp">${JPM[m]}</span>`; };
function horseOpts(sel) { return H.map(h => `<option value="${h[1]}"${sel === h[1] ? " selected" : ""}>${h[1]} ${esc(h[2])}</option>`).join(""); }
function frameOpts() { return [1, 2, 3, 4, 5, 6, 7, 8].map(f => `<option value="${f}">${f}</option>`).join(""); }
function label(t, sel) {
  const T = TYPES[t];
  if (T.frame) return sel.join(" - ");
  return sel.join(T.ord && T.n > 1 ? " → " : " - ");
}

async function render() {
  result = null;
  const [U, D] = await loadAll(["../../assets/i18n", "i18n"], lang);
  u = U.ui; L = D;
  apply(lang); fillText(u);
  document.getElementById("home").href = `../../index.html?lang=${lang}`;
  document.title = plain(L.title);
  const latin = !["ja", "easy"].includes(lang);
  const last = h => {
    const r = h[5], k = r.k === "nw" ? L.nw : r.k === "mw" ? L.mw : r.k;
    const place = r.c === null || r.c === undefined ? "" : typeof r.c === "number" ? rb(L.courses[r.c]) + " " : rb((L.abroad || {})[r.c] || r.c) + " ";
    const dist = r.dist ? `${rb(L.turf)}${r.dist}m ` : "";
    return `${r.d ? r.d + " " : ""}${place}${dist}${rb(k)} · ${rb(fill(L.fin, { n: h[6] }))}${h[7] ? ` (${rb(fill(L.popn, { n: h[7] }))})` : ""}`;
  };
  const dchg = h => { if (!h[5].dist) return `<span class="note">—</span>`; const d = R.dist - h[5].dist; return d === 0 ? `<span class="chip g">${rb(L.same)}</span>` : `<span class="chip">${d > 0 ? "+" : ""}${d}m</span>`; };
  const rows = H.map((h, i) => `<tr><td><span class="waku" style="background:${["#ffffff", "#222222", "#e53935", "#1e5bd8", "#f2c200", "#2e9d3a", "#f57c00", "#ec6fa8"][h[0] - 1]};color:${["#111", "#fff", "#fff", "#fff", "#111", "#fff", "#fff", "#111"][h[0] - 1]}">${h[0]}</span></td><td class="num">${h[1]}</td><td class="hn">${esc(h[2])}</td><td style="white-space:nowrap">${esc(latin ? h[4] : h[3])}</td>${R.showKin ? `<td class="num">${h[10].toFixed(1)}</td>` : ""}<td class="last">${last(h)}</td><td>${dchg(h)}</td><td class="num"><b>${h[8].toFixed(1)}</b></td><td class="num" style="white-space:nowrap">${plTxt(h[1])}</td><td class="num">${h[9]}</td><td class="num"><span class="pbar" style="width:${Math.round(80 / h[8] * 1.6)}px"></span>${(80 / h[8]).toFixed(1)}%</td></tr>`).join("");
  const byPop = [...H].sort((a, b) => a[9] - b[9]);
  const why = byPop.map(h => `<div class="w"><span class="chip">${rb(fill(L.popn, { n: h[9] }))}</span><div><b>${h[1]} ${esc(h[2])}</b> <span class="note">${h[8].toFixed(1)}</span><p>${rb(L.reasons[h[1] - 1])}</p></div></div>`).join("");
    main.innerHTML = `<span class="tag">${rb(L.tag)}</span>
    <h1>${rb(L.title)}</h1><p class="note" style="font-size:18px;margin-top:0">${rb(L.sub)}</p>
    <div class="goalbox"><h3>${rb(L.howH)}</h3><ol class="goal">${L.how.map(x => `<li>${rb(x)}</li>`).join("")}</ol></div>
    <section class="card"><h2>${rb(L.raceH)}</h2><ul>${L.race.map(x => `<li>${rb(x)}</li>`).join("")}</ul><p>${rb(L.course)}</p></section>
    <section class="card"><h2>${rb(L.cardH)}</h2><div class="scroll"><table class="rtab"><thead><tr><th>${rb(u.cardW)}</th><th>${rb(u.cardN)}</th><th>${rb(u.cardName)}</th><th>${rb(u.cardJockey)}</th>${R.showKin ? `<th>${rb(u.cardKin)}</th>` : ""}<th>${rb(L.colLast)}</th><th>${rb(L.colDist)}</th><th>${rb(L.colOdds)}</th><th>${rb(L.colPlace)}</th><th>${rb(L.colPop)}</th><th>${rb(L.colProb)}</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="note">${rb(L.cardNote)}</p></section>
    <section class="card"><h2>${rb(L.whyH)}</h2><p>${rb(L.whyLead)}</p><div class="why">${why}</div></section>
    <section class="card"><h2>${rb(L.hintH)}</h2><ul>${L.hints.map(x => `<li>${rb(x)}</li>`).join("")}</ul></section>
    <section class="card" id="evc"><h2>${rb(L.evH)}</h2><p>${rb(L.evLead)}</p>
      <h3 class="evh3">${rb(L.eqH)}</h3><p>${rb(fill(L.eqLead, { n: NH, n1: NH - 1, n2: NH - 2, all: NH * (NH - 1) * (NH - 2) }))}</p>
      <div class="scroll"><table class="evt" id="eqt"></table></div><p class="note">${rb(L.eqNote)}</p>
      <h3 class="evh3">${rb(L.qH)}</h3><div class="qa" id="qa"></div>
      <h3 class="evh3">${rb(L.mineH)}</h3><p>${rb(L.mineLead)}</p>
      <p><button class="btn" id="rtreset">${rb(L.reset)}</button></p>
      <div class="scroll"><table class="evt" id="mine"></table></div><p class="note">${rb(L.evNote)}</p></section>
    <section class="card" id="simc"><h2>${rb(L.simH)}</h2><p>${rb(L.simLead)}</p>
      <div class="sim">
        <div class="wallet"><span>${rb(L.budget)} <b>${yen(BUDGET)}</b></span><span>${rb(L.used)} <b id="used"></b></span><span>${rb(L.left)} <b id="left"></b></span></div>
        <div class="bt-tabs" id="btabs">${Object.keys(TYPES).map(t => `<button type="button" data-t="${t}">${tTab(t)}</button>`).join("")}</div>
        <div class="bt-sub"><div class="m-tabs" id="moderow"><button type="button" data-m="n">${mName("n")}</button><button type="button" data-m="f">${mName("f")}</button><button type="button" data-m="b">${mName("b")}</button></div><span class="note" id="rateNote"></span></div>
        <div class="scroll"><table class="ptab" id="pick"></table></div>
        <div class="buybar"><div class="bb-pts"><span>${rb(L.ptsH)}</span><b id="npts">0</b></div>
          <label class="bb-amt"><span>${rb(L.perTicket)}</span><span class="amtbox"><input type="number" id="amt" min="100" step="100" value="100"><span>${rb(L.yenUnit)}</span></span></label>
          <div class="bb-tot"><span>${rb(L.totalH)}</span><b id="ntot">¥0</b></div>
          <button class="btn primary" id="add">${rb(L.add)}</button></div>
        <p class="note" id="est" style="margin:0"></p>
        <p class="msg" id="msg"></p>
        <div class="scroll"><table class="tk" id="tickets"></table></div>
        <p class="note">${rb(L.estNote)} ${rb(L.evSimNote)}</p>
      </div></section>
    <section class="card" id="resc"><h2>${rb(L.resH)}</h2><p>${rb(L.resLead)}</p>
      <div class="sim"><div class="row">${[1, 2, 3].map(n => `<label>${rb(fill(L.fin, { n }))}<select id="r${n}"><option value="">—</option>${horseOpts()}</select></label>`).join("")}
        <button class="btn primary" id="check">${rb(L.check)}</button></div>
        <p class="msg" id="rmsg"></p><div id="out"></div></div></section>
    <section class="card"><h2>${rb(L.refH)}</h2><ul>${L.reflect.map(x => `<li>${rb(x)}</li>`).join("")}</ul></section>
    <p class="note">${rb(L.src)}</p>`;
  setupEv();
  setupSim();
}

function setupEv() {
  // ① uniform table
  const C2 = NH * (NH - 1) / 2, C3 = NH * (NH - 1) * (NH - 2) / 6;
  const frames = [...new Set(H.map(h => h[0]))], fp2 = [];
  frames.forEach(f => frames.forEach(g => { if (g < f) return; if (f === g && H.filter(h => h[0] === f).length < 2) return; fp2.push([f, g]); }));
  const wk = fp2.map(s2 => p0("wakuren", s2));
  const rows = [
    ["win", "", NH, "1", 1 / NH],
    ["place", "", NH, "3", 3 / NH],
    ["wakuren", "", fp2.length, "—", null],
    ["umaren", `${NH}×${NH - 1}÷2`, C2, "1", 1 / C2],
    ["wide", `${NH}×${NH - 1}÷2`, C2, "3", 3 / C2],
    ["umatan", `${NH}×${NH - 1}`, NH * (NH - 1), "1", 1 / (NH * (NH - 1))],
    ["trio", `${NH}×${NH - 1}×${NH - 2}÷6`, C3, "1", 1 / C3],
    ["trifecta", `${NH}×${NH - 1}×${NH - 2}`, ALL3, "1", 1 / ALL3]];
  const keyOf = (t, s2) => TYPES[t].ord ? s2.join("-") : [...s2].sort((a, b) => a - b).join("-");
  const allTickets = t => {
    if (t === "wakuren") return fp2;
    const n = TYPES[t].n, out = [];
    const rec = (cur) => { if (cur.length === n) { out.push(cur); return; } for (let v = 1; v <= NH; v++) if (!cur.includes(v)) { if (!TYPES[t].ord && cur.length && v < cur[cur.length - 1]) continue; rec([...cur, v]); } };
    rec([]); return out;
  };
  const good = t => { // tickets whose (estimated) odds beat the uniform break-even
    const m = mktMap(t), T = allTickets(t);
    let g = 0;
    T.forEach(s2 => { const q = m.get(keyOf(t, s2)) || 0; const pu = t === "wakuren" ? p0(t, s2) : rows.find(r => r[0] === t)[4];
      const o = t === "win" ? H[s2[0] - 1][8] : t === "place" ? (R.place[s2[0]][0] + R.place[s2[0]][1]) / 2 : (q > 0 ? R.rates[t] / q : Infinity);
      if (o * pu > 1) g++; });
    return `${g} / ${T.length}`;
  };
  document.getElementById("eqt").innerHTML = `<thead><tr><th>${rb(L.type)}</th><th class="num">${rb(L.cAll)}</th><th class="num">${rb(L.cHit)}</th><th class="num">${rb(L.cP0)}</th><th class="num">${rb(L.cBe)}</th><th class="num">${rb(L.cCnt)}</th></tr></thead><tbody>` +
    rows.map(([t, f, n, h, pr]) => {
      const pTxt = pr === null ? `${fp(Math.min(...wk))}〜${fp(Math.max(...wk))}<div class="f">${rb(L.frVar)}</div>` : `${fp(pr)}<div class="f">${h}/${n.toLocaleString("en-US")}</div>`;
      const be = pr === null ? `${(1 / Math.max(...wk)).toFixed(1)}〜${(1 / Math.min(...wk)).toFixed(1)}` : (1 / pr).toFixed(1);
      return `<tr><td>${tName(t)}</td><td class="num">${n.toLocaleString("en-US")}${f ? `<div class="f">${f}</div>` : ""}</td><td class="num">${h}</td><td class="num">${pTxt}</td><td class="num">${be}</td><td class="num">${good(t)}</td></tr>`;
    }).join("") + `</tbody>`;
  // questions
  const V = { n: NH, all: ALL3.toLocaleString("en-US"), tri: C3.toLocaleString("en-US"), p3t: (100 / ALL3).toFixed(3), p3c: (100 / C3).toFixed(2), pw: (100 / NH).toFixed(1), pp: (300 / NH).toFixed(1) };
  document.getElementById("qa").innerHTML = L.qs.map(([q, a]) => `<details><summary>${rb(fill(q, V))}</summary><p>${rb(fill(a, V))}</p></details>`).join("");
  // ② own ratings
  const mine = document.getElementById("mine");
  const draw = () => {
    buildMine();
    mine.innerHTML = `<thead><tr><th>${rb(u.cardN)}</th><th>${rb(u.cardName)}</th><th class="num">${rb(L.colOdds)}</th><th>${rb(L.cRate)}</th><th class="num">${rb(L.cMkt)}</th><th class="num">${rb(L.cMine)}</th><th class="num">${rb(L.cEv)}</th></tr></thead><tbody>` +
      H.map((h, i) => { const e = PS[i] * h[8]; return `<tr><td class="num">${h[1]}</td><td class="hn">${esc(h[2])}</td><td class="num"><b>${h[8].toFixed(1)}</b></td><td><span class="stp"><button type="button" data-d="-1" data-i="${i}" aria-label="-">−</button><b>${rt[i]}</b><button type="button" data-d="1" data-i="${i}" aria-label="+">＋</button></span></td><td class="num">${fp(p[i])}</td><td class="num">${fp(PS[i])}</td><td class="num">${e.toFixed(2)} ${vchip(e)}</td></tr>`; }).join("") + `</tbody>`;
    mine.querySelectorAll("button[data-d]").forEach(b => b.onclick = () => { const i = +b.dataset.i; rt[i] = Math.max(0, Math.min(5, rt[i] + +b.dataset.d)); saveRt(); draw(); if (document.getElementById("tickets")) { drawTickets(); document.getElementById("amt").dispatchEvent(new Event("input")); } });
  };
  draw();
  document.getElementById("rtreset").onclick = () => { rt = H.map(() => 3); saveRt(); draw(); drawTickets(); document.getElementById("amt").dispatchEvent(new Event("input")); };
}

function setupSim() {
  const btabs = document.getElementById("btabs"), pick = document.getElementById("pick"), amt = document.getElementById("amt"), est = document.getElementById("est"), msg = document.getElementById("msg"), modeRow = document.getElementById("moderow");
  let bt = "win", mode = "n", sets = [];
  const WK = ["#ffffff", "#222222", "#e53935", "#1e5bd8", "#f2c200", "#2e9d3a", "#f57c00", "#ec6fa8"], WT = ["#111", "#fff", "#fff", "#fff", "#111", "#fff", "#fff", "#111"];
  const valid = (t, sel) => {
    if (TYPES[t].frame) { if (sel[0] === sel[1]) return H.filter(h => h[0] === sel[0]).length >= 2; return true; }
    return new Set(sel).size === sel.length;
  };
  const ncols = () => { const T = TYPES[bt]; return T.n === 1 || mode === "b" ? 1 : T.n; };
  const combos = () => {
    const T = TYPES[bt];
    const S = mode === "b" && T.n > 1 ? Array.from({ length: T.n }, () => sets[0] || []) : sets;
    let out = [[]];
    for (let i = 0; i < T.n; i++) { const nx = []; out.forEach(c => (S[i] || []).forEach(v => nx.push([...c, v]))); out = nx; }
    const seen = new Set(), res = [];
    out.forEach(c => {
      if (!valid(bt, c)) return;
      if (T.frame && mode === "b" && c[0] === c[1]) return;
      const k = T.ord ? c : [...c].sort((x, y) => x - y), key = k.join("-");
      if (!seen.has(key)) { seen.add(key); res.push(k); }
    });
    return res;
  };
  const colLabel = i => {
    const T = TYPES[bt];
    if (T.n === 1) return isJa() ? L.types[bt] : loc(L.types[bt]);
    if (mode === "b") return isJa() ? L.modeB : loc(L.modeB);
    if (T.ord) return fill(L.fin, { n: i + 1 });
    return T.frame ? fill(L.frameN, { n: i + 1 }) : fill(L.horseN, { n: i + 1 });
  };
  const drawPick = () => {
    const T = TYPES[bt];
    btabs.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.t === bt));
    modeRow.querySelectorAll("button").forEach(x => { x.hidden = T.n === 1 && x.dataset.m !== "n"; x.classList.toggle("on", x.dataset.m === mode); });
    document.getElementById("rateNote").textContent = plain(L.payRate) + " " + (R.rates[bt] * 100).toFixed(1).replace(".0", "") + "%";
    const nc = ncols();
    sets = Array.from({ length: nc }, (_, i) => sets[i] || []);
    const head = `<thead><tr><th>${rb(T.frame ? u.cardW : u.cardN)}</th><th>${rb(u.cardName)}</th>${T.frame ? "" : `<th class="num">${rb(bt === "place" ? L.colPlace : L.colOdds)}</th>`}${Array.from({ length: nc }, (_, i) => `<th class="ck">${rb(colLabel(i))}</th>`).join("")}</tr></thead>`;
    const cell = (i, v) => `<td class="ck"><button type="button" class="cb${sets[i].includes(v) ? " on" : ""}" data-i="${i}" data-v="${v}" aria-label="${v}"></button></td>`;
    let body;
    if (T.frame) {
      body = [1, 2, 3, 4, 5, 6, 7, 8].map(f => `<tr class="${sets.some(x => x.includes(f)) ? "sel" : ""}"><td><span class="waku" style="background:${WK[f - 1]};color:${WT[f - 1]}">${f}</span></td><td>${H.filter(h => h[0] === f).map(h => `<div><span class="sub">${h[1]}</span> <span class="nm">${esc(h[2])}</span></div>`).join("")}</td>${Array.from({ length: nc }, (_, i) => cell(i, f)).join("")}</tr>`).join("");
    } else {
      body = H.map(h => `<tr class="${sets.some(x => x.includes(h[1])) ? "sel" : ""}"><td><span class="waku" title="${h[0]}" style="background:${WK[h[0] - 1]};color:${WT[h[0] - 1]}">${h[1]}</span></td><td><span class="nm">${esc(h[2])}</span><div class="sub">${esc(["ja", "easy"].includes(lang) ? h[3] : h[4])}</div></td><td class="num"><b>${bt === "place" ? plTxt(h[1]) : h[8].toFixed(1)}</b><div class="sub pop">${rb(fill(L.popn, { n: h[9] }))}</div></td>${Array.from({ length: nc }, (_, i) => cell(i, h[1])).join("")}</tr>`).join("");
    }
    pick.innerHTML = head + `<tbody>${body}</tbody>`;
    pick.querySelectorAll(".cb").forEach(c => c.onclick = () => {
      const i = +c.dataset.i, v = +c.dataset.v;
      if (mode === "n") {
        // normal: one choice per column
        sets[i] = sets[i].includes(v) ? [] : [v];
      } else sets[i] = sets[i].includes(v) ? sets[i].filter(x => x !== v) : [...sets[i], v].sort((x, y) => x - y);
      drawPick();
    });
    upd();
  };
  btabs.querySelectorAll("button").forEach(x => x.onclick = () => { bt = x.dataset.t; if (TYPES[bt].n === 1 && mode === "b") mode = "n"; sets = []; drawPick(); });
  modeRow.querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; sets = []; drawPick(); });
  function upd() {
    msg.textContent = "";
    const C = combos(), a = Math.floor(Math.max(0, +amt.value || 0) / 100) * 100;
    document.getElementById("npts").textContent = plain(fill(L.pts, { n: C.length }));
    document.getElementById("ntot").textContent = yen(C.length * a);
    if (!C.length) { est.innerHTML = rb(L.pickHelp); return; }
    const rs = C.map(c => payRange(bt, c, a)), lo = Math.min(...rs.map(r => r[0])), hi = Math.max(...rs.map(r => r[1]));
    const oddsTxt = C.length === 1 ? `${rb(bt === "win" || bt === "place" ? L.odds : L.estOdds)} <b>${oddsDisp(bt, C[0])}</b> · ` : "";
    const ev1 = C.length === 1 ? evOf(bt, C[0]) : null;
    const evTxt = C.length === 1 ? `<br>${rb(L.pU)} ${fp(p0(bt, C[0]))} · ${rb(L.pM)} ${fp(prob(bt, C[0]))} · ${rb(L.pS)} ${fp(probS(bt, C[0]))} → ${rb(L.cEv)} <b>${ev1 === null ? "—" : ev1.toFixed(2)}</b> ${vchip(ev1)}` : "";
    est.innerHTML = `${oddsTxt}${rb(L.ifHit)} <b>${lo === hi ? yen(lo) : yen(lo) + " 〜 " + yen(hi)}</b>${evTxt}`;
  }
  amt.oninput = upd;
  document.getElementById("add").onclick = () => {
    const C = combos(), a = Math.floor((+amt.value || 0) / 100) * 100;
    if (!C.length) { msg.innerHTML = rb(L.errNone); return; }
    if (a < 100) { msg.innerHTML = rb(L.errAmt); return; }
    const usedNow = bets.reduce((s, b) => s + b.a, 0);
    if (usedNow + a * C.length > BUDGET) { msg.innerHTML = rb(L.errOver) + " " + rb(fill(L.needH, { a: yen(a * C.length), l: yen(BUDGET - usedNow) })); return; }
    C.forEach(s2 => { const same = bets.find(b => b.t === bt && b.s.join() === s2.join()); if (same) same.a += a; else bets.push({ t: bt, s: s2, a, act: "" }); });
    sets = []; save(); drawTickets(); drawPick();
  };
  drawPick(); drawTickets();
  document.getElementById("check").onclick = check;
}


function drawTickets() {
  const used = bets.reduce((s, b) => s + b.a, 0);
  document.getElementById("used").textContent = yen(used);
  document.getElementById("left").textContent = yen(BUDGET - used);
  const tb = document.getElementById("tickets");
  if (!bets.length) { tb.innerHTML = `<tr><td class="note">${rb(L.empty)}</td></tr>`; return; }
  tb.innerHTML = `<thead><tr><th>${rb(L.type)}</th><th>${rb(L.pickH)}</th><th class="num">${rb(L.amount)}</th><th class="num">${rb(L.odds)}</th><th class="num">${rb(L.ifHit)}</th><th class="num">${rb(L.cEv)}</th>${result ? `<th>${rb(L.payH)}</th>` : ""}<th></th></tr></thead><tbody>` +
    bets.map((b, i) => {
      const o = estOdds(b.t, b.s), h = result && hits(b.t, b.s, ...result);
      return `<tr class="${h ? "hit" : ""}"><td>${tName(b.t)}</td><td>${label(b.t, b.s)}</td><td class="num">${yen(b.a)}</td><td class="num" style="white-space:nowrap">${oddsDisp(b.t, b.s)}</td><td class="num">${o ? yr(payRange(b.t, b.s, b.a)) : "—"}</td><td class="num">${(e => e === null ? "—" : e.toFixed(2) + " " + vchip(e))(evOf(b.t, b.s))}</td>${result ? `<td>${h ? `<b>${rb(L.hit)}</b> <input type="number" min="100" step="10" data-i="${i}" placeholder="${esc(plain(L.actualPh))}" value="${b.act || ""}">` : rb(L.miss)}</td>` : ""}<td><button class="x" data-del="${i}" aria-label="delete">×</button></td></tr>`;
    }).join("") + `</tbody>`;
  tb.querySelectorAll("[data-del]").forEach(x => x.onclick = () => { bets.splice(+x.dataset.del, 1); save(); drawTickets(); if (result) summary(); });
  tb.querySelectorAll("input[data-i]").forEach(x => x.oninput = () => { bets[+x.dataset.i].act = x.value; save(); summary(); });
}
function check() {
  const r = [1, 2, 3].map(n => +document.getElementById("r" + n).value), m = document.getElementById("rmsg");
  if (r.some(x => !x) || new Set(r).size < 3) { m.innerHTML = rb(L.errRes); return; }
  m.textContent = ""; result = r; drawTickets(); summary();
}
function summary() {
  const used = bets.reduce((s, b) => s + b.a, 0);
  let back = 0, estOnly = false;
  bets.forEach(b => {
    if (!hits(b.t, b.s, ...result)) return;
    const act = +b.act;
    if (act >= 100) back += b.a / 100 * act;
    else { estOnly = true; back += b.a / 100 * Math.round((estOdds(b.t, b.s) || 0) * 100); }
  });
  const rate = used ? back / used * 100 : 0;
  document.getElementById("out").innerHTML = `<div class="sum2"><div>${rb(L.backH)}<div class="big">${yen(back)}</div></div><div>${rb(L.rateH)}<div class="big" style="color:${rate >= 100 ? "var(--ok)" : "var(--ng)"}">${rate.toFixed(0)}%</div></div><div>${rb(L.endH)}<div class="big">${yen(BUDGET - used + back)}</div></div></div>${estOnly ? `<p class="note">${rb(L.estWarn)}</p>` : ""}`;
}

langSelect(document.getElementById("lang"), lang, v => { lang = v; render(); });
render();
}
</script>
