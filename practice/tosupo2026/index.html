<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>疑似予想:東京スポーツ杯2歳S</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&family=Noto+Sans+Sinhala:wght@400;700&family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/style.css">
<style>
.rtab{width:100%;border-collapse:collapse;font-size:14px}
.rtab th,.rtab td{padding:8px 6px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
.rtab th{font-size:12px;color:var(--sub);font-weight:600}
.rtab td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rtab .hn{font-weight:700;white-space:nowrap}
.rtab .last{font-size:12px;color:var(--sub);min-width:150px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pbar{display:inline-block;height:8px;background:var(--acc);border-radius:4px;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accsoft);color:var(--acctext);font-weight:600;white-space:nowrap}
.chip.g{background:light-dark(#e6e8eb,#2a2d31);color:var(--sub)}
.why{display:grid;gap:10px}
.why .w{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--rule)}
.why .w b{white-space:nowrap}
.why .w p{margin:4px 0 0}
.sim{display:grid;gap:12px}
.sim .row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.sim label{display:grid;gap:4px;font-size:13px;color:var(--sub)}
.sim select,.sim input{font:inherit;font-size:16px;padding:8px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink);min-width:0}
.sim input[type=number]{width:120px}
.wallet{display:flex;gap:18px;flex-wrap:wrap;font-size:15px}
.wallet b{font-size:20px;font-variant-numeric:tabular-nums}
.tk{width:100%;border-collapse:collapse;font-size:14px}
.tk td,.tk th{padding:8px 6px;border-bottom:1px solid var(--rule);text-align:left}
.tk th{font-size:12px;color:var(--sub)}
.tk td{white-space:nowrap}.tk td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tk tr.hit td{background:light-dark(#e3f5ea,#0f2a1c)}
.tk input{width:90px;font:inherit;padding:4px 6px;border-radius:6px;border:1px solid var(--rule);background:var(--card);color:var(--ink)}
.x{border:0;background:none;color:var(--ng);font-size:18px;cursor:pointer;padding:2px 6px}
.bt-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.bt-tabs button{font:inherit;font-size:14px;font-weight:700;padding:10px 4px;border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.bt-tabs button:nth-child(4n){border-right:0}.bt-tabs button:nth-child(n+5){border-bottom:0}
.bt-tabs button.on{background:var(--acc);color:#fff}
@media(min-width:760px){.bt-tabs{grid-template-columns:repeat(8,1fr)}.bt-tabs button{border-bottom:0}.bt-tabs button:nth-child(4n){border-right:1px solid var(--rule)}.bt-tabs button:last-child{border-right:0}}
.bt-sub{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.m-tabs{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.m-tabs button{font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border:0;background:var(--card);color:var(--sub);cursor:pointer}
.m-tabs button.on{background:var(--ink);color:var(--card)}
.m-tabs button[hidden]{display:none}
.ptab{width:100%;border-collapse:collapse;font-size:14px}
.ptab th{font-size:12px;color:var(--sub);font-weight:600;padding:6px;border-bottom:2px solid var(--line);text-align:left}
.ptab th.ck{text-align:center;min-width:44px}
.ptab td{padding:4px 6px;border-bottom:1px solid var(--rule);vertical-align:middle}
.ptab td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ptab td.ck{text-align:center}
.ptab tr.sel td{background:var(--accsoft)}
.ptab .nm{font-weight:700;white-space:nowrap}
.ptab .sub{font-size:12px;color:var(--sub)}
.cb{width:30px;height:30px;border-radius:7px;border:2px solid var(--rule);background:var(--card);cursor:pointer;font-weight:700;color:#fff;font-size:15px;padding:0}
.cb.on{background:var(--acc);border-color:var(--acc)}
.cb.on::after{content:"✓"}
.buybar{display:flex;flex-wrap:wrap;gap:14px;align-items:end;padding:12px;border-radius:12px;background:light-dark(#f3f4f6,#16181b);border:1px solid var(--rule)}
.buybar>div,.buybar>label{display:grid;gap:2px;font-size:12px;color:var(--sub)}
.buybar b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.amtbox{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-size:14px}
.buybar #add{margin-left:auto}
.pkrow{display:grid;gap:6px;margin:8px 0}.pkl{font-size:13px;color:var(--sub);font-weight:600}
.pk{display:flex;flex-wrap:wrap;gap:6px}
.hc{font:inherit;font-size:15px;font-weight:700;min-width:40px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.hc.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hc.wide{font-size:14px;height:36px}
#moderow[hidden]{display:none}
@media(max-width:640px){.ptab .nm{white-space:normal;font-size:13px}.ptab td,.ptab th{padding:4px 3px}.ptab th.ck{min-width:34px;font-size:11px}.cb{width:28px;height:28px}.ptab .sub.pop{display:none}}
.msg{color:var(--ng);font-size:14px;min-height:1em}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.sum2{display:flex;gap:24px;flex-wrap:wrap;align-items:end}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><a class="home" id="home" href="../../index.html">← <span data-t="toc"></span></a><label class="langsel"><span data-t="lang"></span><select id="lang"></select></label></div>
 <main id="main"></main>
 <footer data-t="footer"></footer>
</div>
<script src="../../assets/core.js"></script>
<script src="race.js"></script>
<script>
{
const { rb, esc, fill, detect, loadAll, langSelect, apply, fillText, plain } = window.AI;
const R = window.RACE, H = R.horses;
let lang = detect();
const main = document.getElementById("main");
const KEY = "ds-tosupo2026-bets";
let bets = [];
try { bets = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { bets = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(bets)); } catch (e) {} };
const BUDGET = 10000;
const yen = n => "¥" + Math.round(n).toLocaleString("en-US");

/* ---- probability model (Harville) from win odds: only an estimate ---- */
const raw = H.map(h => 0.8 / h[8]), tot = raw.reduce((a, b) => a + b, 0);
const p = raw.map(x => x / tot); // index 0..11 = horse no 1..12
const P3 = []; // ordered top-3 probabilities
for (let i = 0; i < 12; i++) for (let j = 0; j < 12; j++) if (j !== i) for (let k = 0; k < 12; k++) if (k !== i && k !== j)
  P3.push([i, j, k, p[i] * p[j] / (1 - p[i]) * p[k] / (1 - p[i] - p[j])]);
const frameOf = n => H[n - 1][0];
const TYPES = {
  win: { n: 1, ord: true }, place: { n: 1, ord: true }, wakuren: { n: 2, ord: false, frame: true }, umaren: { n: 2, ord: false },
  wide: { n: 2, ord: false }, umatan: { n: 2, ord: true }, trio: { n: 3, ord: false }, trifecta: { n: 3, ord: true }
};
// does ticket hit given finishing order a,b,c (horse numbers)
function hits(t, sel, a, b, c) {
  const s = sel, set = new Set(s);
  switch (t) {
    case "win": return s[0] === a;
    case "place": return [a, b, c].includes(s[0]);
    case "wakuren": { const f = [frameOf(a), frameOf(b)].sort(), g = [...s].sort(); return f[0] === g[0] && f[1] === g[1]; }
    case "umaren": return set.has(a) && set.has(b);
    case "wide": return [a, b, c].filter(x => set.has(x)).length === 2;
    case "umatan": return s[0] === a && s[1] === b;
    case "trio": return set.has(a) && set.has(b) && set.has(c);
    case "trifecta": return s[0] === a && s[1] === b && s[2] === c;
  }
}
function prob(t, sel) { return P3.reduce((acc, [i, j, k, q]) => acc + (hits(t, sel, i + 1, j + 1, k + 1) ? q : 0), 0); }
function estOdds(t, sel) {
  if (t === "win") return H[sel[0] - 1][8];
  const q = prob(t, sel);
  if (q <= 0) return null;
  return Math.max(1.0, Math.floor(R.rates[t] / q * 10) / 10);
}

let L, u, result = null;
function horseOpts(sel) { return H.map(h => `<option value="${h[1]}"${sel === h[1] ? " selected" : ""}>${h[1]} ${esc(h[2])}</option>`).join(""); }
function frameOpts() { return [1, 2, 3, 4, 5, 6, 7, 8].map(f => `<option value="${f}">${f}</option>`).join(""); }
function label(t, sel) {
  const T = TYPES[t];
  if (T.frame) return sel.join(" - ");
  return sel.join(T.ord && T.n > 1 ? " → " : " - ");
}

async function render() {
  result = null;
  const [U, D] = await loadAll(["../../assets/i18n", "i18n"], lang);
  u = U.ui; L = D;
  apply(lang); fillText(u);
  document.getElementById("home").href = `../../index.html?lang=${lang}`;
  document.title = plain(L.title);
  const latin = !["ja", "easy"].includes(lang);
  const last = h => {
    const r = h[5], k = r.k === "nw" ? L.nw : r.k === "mw" ? L.mw : r.k;
    return `${r.d} ${rb(L.courses[r.c])} ${rb(L.turf)}${r.dist}m ${rb(k)} · ${rb(fill(L.fin, { n: h[6] }))} (${rb(fill(L.popn, { n: h[7] }))})`;
  };
  const dchg = h => { const d = R.dist - h[5].dist; return d === 0 ? `<span class="chip g">${rb(L.same)}</span>` : `<span class="chip">${d > 0 ? "+" : ""}${d}m</span>`; };
  const rows = H.map((h, i) => `<tr><td><span class="waku" style="background:${["#ffffff", "#222222", "#e53935", "#1e5bd8", "#f2c200", "#2e9d3a", "#f57c00", "#ec6fa8"][h[0] - 1]};color:${["#111", "#fff", "#fff", "#fff", "#111", "#fff", "#fff", "#111"][h[0] - 1]}">${h[0]}</span></td><td class="num">${h[1]}</td><td class="hn">${esc(h[2])}</td><td style="white-space:nowrap">${esc(latin ? h[4] : h[3])}</td><td class="last">${last(h)}</td><td>${dchg(h)}</td><td class="num"><b>${h[8].toFixed(1)}</b></td><td class="num">${h[9]}</td><td class="num"><span class="pbar" style="width:${Math.round(80 / h[8] * 1.6)}px"></span>${(80 / h[8]).toFixed(1)}%</td></tr>`).join("");
  const byPop = [...H].sort((a, b) => a[9] - b[9]);
  const why = byPop.map(h => `<div class="w"><span class="chip">${rb(fill(L.popn, { n: h[9] }))}</span><div><b>${h[1]} ${esc(h[2])}</b> <span class="note">${h[8].toFixed(1)}</span><p>${rb(L.reasons[h[1] - 1])}</p></div></div>`).join("");
    main.innerHTML = `<span class="tag">${rb(L.tag)}</span>
    <h1>${rb(L.title)}</h1><p class="note" style="font-size:18px;margin-top:0">${rb(L.sub)}</p>
    <div class="goalbox"><h3>${rb(L.howH)}</h3><ol class="goal">${L.how.map(x => `<li>${rb(x)}</li>`).join("")}</ol></div>
    <section class="card"><h2>${rb(L.raceH)}</h2><ul>${L.race.map(x => `<li>${rb(x)}</li>`).join("")}</ul><p>${rb(L.course)}</p></section>
    <section class="card"><h2>${rb(L.cardH)}</h2><div class="scroll"><table class="rtab"><thead><tr><th>${rb(u.cardW)}</th><th>${rb(u.cardN)}</th><th>${rb(u.cardName)}</th><th>${rb(u.cardJockey)}</th><th>${rb(L.colLast)}</th><th>${rb(L.colDist)}</th><th>${rb(L.colOdds)}</th><th>${rb(L.colPop)}</th><th>${rb(L.colProb)}</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="note">${rb(L.cardNote)}</p></section>
    <section class="card"><h2>${rb(L.whyH)}</h2><p>${rb(L.whyLead)}</p><div class="why">${why}</div></section>
    <section class="card"><h2>${rb(L.hintH)}</h2><ul>${L.hints.map(x => `<li>${rb(x)}</li>`).join("")}</ul></section>
    <section class="card" id="simc"><h2>${rb(L.simH)}</h2><p>${rb(L.simLead)}</p>
      <div class="sim">
        <div class="wallet"><span>${rb(L.budget)} <b>${yen(BUDGET)}</b></span><span>${rb(L.used)} <b id="used"></b></span><span>${rb(L.left)} <b id="left"></b></span></div>
        <div class="bt-tabs" id="btabs">${Object.keys(TYPES).map(t => `<button type="button" data-t="${t}">${rb(L.types[t]).replace(/ \(.*\)$/, "")}</button>`).join("")}</div>
        <div class="bt-sub"><div class="m-tabs" id="moderow"><button type="button" data-m="n">${rb(L.modeN)}</button><button type="button" data-m="f">${rb(L.modeF)}</button><button type="button" data-m="b">${rb(L.modeB)}</button></div><span class="note" id="rateNote"></span></div>
        <div class="scroll"><table class="ptab" id="pick"></table></div>
        <div class="buybar"><div class="bb-pts"><span>${rb(L.ptsH)}</span><b id="npts">0</b></div>
          <label class="bb-amt"><span>${rb(L.perTicket)}</span><span class="amtbox"><input type="number" id="amt" min="100" step="100" value="100"><span>${rb(L.yenUnit)}</span></span></label>
          <div class="bb-tot"><span>${rb(L.totalH)}</span><b id="ntot">¥0</b></div>
          <button class="btn primary" id="add">${rb(L.add)}</button></div>
        <p class="note" id="est" style="margin:0"></p>
        <p class="msg" id="msg"></p>
        <div class="scroll"><table class="tk" id="tickets"></table></div>
        <p class="note">${rb(L.estNote)}</p>
      </div></section>
    <section class="card" id="resc"><h2>${rb(L.resH)}</h2><p>${rb(L.resLead)}</p>
      <div class="sim"><div class="row">${[1, 2, 3].map(n => `<label>${rb(fill(L.fin, { n }))}<select id="r${n}"><option value="">—</option>${horseOpts()}</select></label>`).join("")}
        <button class="btn primary" id="check">${rb(L.check)}</button></div>
        <p class="msg" id="rmsg"></p><div id="out"></div></div></section>
    <section class="card"><h2>${rb(L.refH)}</h2><ul>${L.reflect.map(x => `<li>${rb(x)}</li>`).join("")}</ul></section>
    <p class="note">${rb(L.src)}</p>`;
  setupSim();
}

function setupSim() {
  const btabs = document.getElementById("btabs"), pick = document.getElementById("pick"), amt = document.getElementById("amt"), est = document.getElementById("est"), msg = document.getElementById("msg"), modeRow = document.getElementById("moderow");
  let bt = "win", mode = "n", sets = [];
  const WK = ["#ffffff", "#222222", "#e53935", "#1e5bd8", "#f2c200", "#2e9d3a", "#f57c00", "#ec6fa8"], WT = ["#111", "#fff", "#fff", "#fff", "#111", "#fff", "#fff", "#111"];
  const valid = (t, sel) => {
    if (TYPES[t].frame) { if (sel[0] === sel[1]) return H.filter(h => h[0] === sel[0]).length >= 2; return true; }
    return new Set(sel).size === sel.length;
  };
  const ncols = () => { const T = TYPES[bt]; return T.n === 1 || mode === "b" ? 1 : T.n; };
  const combos = () => {
    const T = TYPES[bt];
    const S = mode === "b" && T.n > 1 ? Array.from({ length: T.n }, () => sets[0] || []) : sets;
    let out = [[]];
    for (let i = 0; i < T.n; i++) { const nx = []; out.forEach(c => (S[i] || []).forEach(v => nx.push([...c, v]))); out = nx; }
    const seen = new Set(), res = [];
    out.forEach(c => {
      if (!valid(bt, c)) return;
      if (T.frame && mode === "b" && c[0] === c[1]) return;
      const k = T.ord ? c : [...c].sort((x, y) => x - y), key = k.join("-");
      if (!seen.has(key)) { seen.add(key); res.push(k); }
    });
    return res;
  };
  const colLabel = i => {
    const T = TYPES[bt];
    if (T.n === 1) return L.types[bt].replace(/ \(.*\)$/, "");
    if (mode === "b") return L.modeB;
    if (T.ord) return fill(L.fin, { n: i + 1 });
    return T.frame ? fill(L.frameN, { n: i + 1 }) : fill(L.horseN, { n: i + 1 });
  };
  const drawPick = () => {
    const T = TYPES[bt];
    btabs.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.t === bt));
    modeRow.querySelectorAll("button").forEach(x => { x.hidden = T.n === 1 && x.dataset.m !== "n"; x.classList.toggle("on", x.dataset.m === mode); });
    document.getElementById("rateNote").textContent = plain(L.payRate) + " " + (R.rates[bt] * 100).toFixed(1).replace(".0", "") + "%";
    const nc = ncols();
    sets = Array.from({ length: nc }, (_, i) => sets[i] || []);
    const head = `<thead><tr><th>${rb(T.frame ? u.cardW : u.cardN)}</th><th>${rb(u.cardName)}</th>${T.frame ? "" : `<th class="num">${rb(L.colOdds)}</th>`}${Array.from({ length: nc }, (_, i) => `<th class="ck">${rb(colLabel(i))}</th>`).join("")}</tr></thead>`;
    const cell = (i, v) => `<td class="ck"><button type="button" class="cb${sets[i].includes(v) ? " on" : ""}" data-i="${i}" data-v="${v}" aria-label="${v}"></button></td>`;
    let body;
    if (T.frame) {
      body = [1, 2, 3, 4, 5, 6, 7, 8].map(f => `<tr class="${sets.some(x => x.includes(f)) ? "sel" : ""}"><td><span class="waku" style="background:${WK[f - 1]};color:${WT[f - 1]}">${f}</span></td><td>${H.filter(h => h[0] === f).map(h => `<div><span class="sub">${h[1]}</span> <span class="nm">${esc(h[2])}</span></div>`).join("")}</td>${Array.from({ length: nc }, (_, i) => cell(i, f)).join("")}</tr>`).join("");
    } else {
      body = H.map(h => `<tr class="${sets.some(x => x.includes(h[1])) ? "sel" : ""}"><td><span class="waku" title="${h[0]}" style="background:${WK[h[0] - 1]};color:${WT[h[0] - 1]}">${h[1]}</span></td><td><span class="nm">${esc(h[2])}</span><div class="sub">${esc(["ja", "easy"].includes(lang) ? h[3] : h[4])}</div></td><td class="num"><b>${h[8].toFixed(1)}</b><div class="sub pop">${rb(fill(L.popn, { n: h[9] }))}</div></td>${Array.from({ length: nc }, (_, i) => cell(i, h[1])).join("")}</tr>`).join("");
    }
    pick.innerHTML = head + `<tbody>${body}</tbody>`;
    pick.querySelectorAll(".cb").forEach(c => c.onclick = () => {
      const i = +c.dataset.i, v = +c.dataset.v;
      if (mode === "n") {
        // normal: one choice per column
        sets[i] = sets[i].includes(v) ? [] : [v];
      } else sets[i] = sets[i].includes(v) ? sets[i].filter(x => x !== v) : [...sets[i], v].sort((x, y) => x - y);
      drawPick();
    });
    upd();
  };
  btabs.querySelectorAll("button").forEach(x => x.onclick = () => { bt = x.dataset.t; if (TYPES[bt].n === 1 && mode === "b") mode = "n"; sets = []; drawPick(); });
  modeRow.querySelectorAll("button").forEach(x => x.onclick = () => { mode = x.dataset.m; sets = []; drawPick(); });
  function upd() {
    msg.textContent = "";
    const C = combos(), a = Math.floor(Math.max(0, +amt.value || 0) / 100) * 100;
    document.getElementById("npts").textContent = plain(fill(L.pts, { n: C.length }));
    document.getElementById("ntot").textContent = yen(C.length * a);
    if (!C.length) { est.innerHTML = rb(L.pickHelp); return; }
    const pays = C.map(c => a / 100 * Math.round((estOdds(bt, c) || 0) * 100)), lo = Math.min(...pays), hi = Math.max(...pays);
    const oddsTxt = C.length === 1 ? `${rb(bt === "win" ? L.odds : L.estOdds)} <b>${(estOdds(bt, C[0]) || 0).toFixed(1)}</b> · ` : "";
    est.innerHTML = `${oddsTxt}${rb(L.ifHit)} <b>${lo === hi ? yen(lo) : yen(lo) + " 〜 " + yen(hi)}</b>`;
  }
  amt.oninput = upd;
  document.getElementById("add").onclick = () => {
    const C = combos(), a = Math.floor((+amt.value || 0) / 100) * 100;
    if (!C.length) { msg.innerHTML = rb(L.errNone); return; }
    if (a < 100) { msg.innerHTML = rb(L.errAmt); return; }
    const usedNow = bets.reduce((s, b) => s + b.a, 0);
    if (usedNow + a * C.length > BUDGET) { msg.innerHTML = rb(L.errOver) + " " + rb(fill(L.needH, { a: yen(a * C.length), l: yen(BUDGET - usedNow) })); return; }
    C.forEach(s2 => { const same = bets.find(b => b.t === bt && b.s.join() === s2.join()); if (same) same.a += a; else bets.push({ t: bt, s: s2, a, act: "" }); });
    sets = []; save(); drawTickets(); drawPick();
  };
  drawPick(); drawTickets();
  document.getElementById("check").onclick = check;
}


function drawTickets() {
  const used = bets.reduce((s, b) => s + b.a, 0);
  document.getElementById("used").textContent = yen(used);
  document.getElementById("left").textContent = yen(BUDGET - used);
  const tb = document.getElementById("tickets");
  if (!bets.length) { tb.innerHTML = `<tr><td class="note">${rb(L.empty)}</td></tr>`; return; }
  tb.innerHTML = `<thead><tr><th>${rb(L.type)}</th><th>${rb(L.pickH)}</th><th class="num">${rb(L.amount)}</th><th class="num">${rb(L.estOdds)}</th><th class="num">${rb(L.ifHit)}</th>${result ? `<th>${rb(L.payH)}</th>` : ""}<th></th></tr></thead><tbody>` +
    bets.map((b, i) => {
      const o = estOdds(b.t, b.s), h = result && hits(b.t, b.s, ...result);
      return `<tr class="${h ? "hit" : ""}"><td>${rb(L.types[b.t])}</td><td>${label(b.t, b.s)}</td><td class="num">${yen(b.a)}</td><td class="num">${o ? o.toFixed(1) : "—"}</td><td class="num">${o ? yen(b.a / 100 * Math.round(o * 100)) : "—"}</td>${result ? `<td>${h ? `<b>${rb(L.hit)}</b> <input type="number" min="100" step="10" data-i="${i}" placeholder="${esc(plain(L.actualPh))}" value="${b.act || ""}">` : rb(L.miss)}</td>` : ""}<td><button class="x" data-del="${i}" aria-label="delete">×</button></td></tr>`;
    }).join("") + `</tbody>`;
  tb.querySelectorAll("[data-del]").forEach(x => x.onclick = () => { bets.splice(+x.dataset.del, 1); save(); drawTickets(); if (result) summary(); });
  tb.querySelectorAll("input[data-i]").forEach(x => x.oninput = () => { bets[+x.dataset.i].act = x.value; save(); summary(); });
}
function check() {
  const r = [1, 2, 3].map(n => +document.getElementById("r" + n).value), m = document.getElementById("rmsg");
  if (r.some(x => !x) || new Set(r).size < 3) { m.innerHTML = rb(L.errRes); return; }
  m.textContent = ""; result = r; drawTickets(); summary();
}
function summary() {
  const used = bets.reduce((s, b) => s + b.a, 0);
  let back = 0, estOnly = false;
  bets.forEach(b => {
    if (!hits(b.t, b.s, ...result)) return;
    const act = +b.act;
    if (act >= 100) back += b.a / 100 * act;
    else { estOnly = true; back += b.a / 100 * Math.round((estOdds(b.t, b.s) || 0) * 100); }
  });
  const rate = used ? back / used * 100 : 0;
  document.getElementById("out").innerHTML = `<div class="sum2"><div>${rb(L.backH)}<div class="big">${yen(back)}</div></div><div>${rb(L.rateH)}<div class="big" style="color:${rate >= 100 ? "var(--ok)" : "var(--ng)"}">${rate.toFixed(0)}%</div></div><div>${rb(L.endH)}<div class="big">${yen(BUDGET - used + back)}</div></div></div>${estOnly ? `<p class="note">${rb(L.estWarn)}</p>` : ""}`;
}

langSelect(document.getElementById("lang"), lang, v => { lang = v; render(); });
render();
}
</script>
